<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>US Distributor Map</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100%; }
    .legend {
      background: white;
      padding: 10px;
      line-height: 1.4em;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
<div id="map"></div>

<script>
/*********************************************************
CONFIGURATION
*********************************************************/

// OPTION 1 (recommended): publish Google Sheet as CSV
// Example format:
// state,distributor
// CA,Distributor A
// NV,Distributor B
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR8__ns1VPKjm46xYBZDuiatEvjysORVUIh8JHUE3n0jg-mG7g4a-T7UI8MEgrglcE7kJN8AFMuaTno/pub?output=csv";


// US States GeoJSON (simplified CDN)
const GEOJSON_URL = "https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-states.json";

/*********************************************************
MAP INIT
*********************************************************/
const map = L.map('map').setView([39.5, -98.35], 4);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '© OpenStreetMap'
}).addTo(map);

let geoLayer;
let distributorData = {};

/*********************************************************
DATA LOADING (Google Sheets CSV)
*********************************************************/
async function loadSheetData() {
  const res = await fetch(SHEET_CSV_URL);
  const text = await res.text();

  console.log("RAW CSV:", text);

  const rows = text
    .trim()
    .split("\n")
    .map(r => r.trim())
    .filter(r => r.length > 0);

  // --- SAFE HEADER PARSING ---
  const headers = rows[0]
    .split(/,|\t/)
    .map(h => h.trim().toLowerCase());

  const stateIdx = headers.findIndex(h => h === "state");
  const distIdx = headers.findIndex(h => h === "distributor");

  if (stateIdx === -1 || distIdx === -1) {
    console.error("Missing required columns. Headers found:", headers);
    return;
  }

  distributorData = {};

  // --- SAFE ROW PARSING ---
  for (let i = 1; i < rows.length; i++) {
    const cols = rows[i].split(/,|\t/).map(c => c.trim());

    const state = cols[stateIdx];
    const distributor = cols[distIdx];

    // 🚨 prevent crash + skip bad rows
    if (!state || !distributor) continue;

    distributorData[state] = distributor;
  }

  console.log("Loaded data:", distributorData);
}

/*********************************************************
COLORING
*********************************************************/
const distributorColors = {};
const palette = [
  "#1f77b4", // muted blue
  "#ff7f0e", // bright orange
  "#2ca02c", // medium green
  "#d62728", // strong red
  "#9467bd", // soft purple
  "#8c564b", // brown
  "#e377c2", // pink
  "#7f7f7f", // medium gray
  "#bcbd22", // olive yellow
  "#17becf", // cyan / teal
  "#301934", // dark purple (eggplant)
  "#FFDE21"  // bright yellow
  "#00A6A6", // teal (distinct from #17becf)
  "#F18F01", // deep orange
  "#C73E1D", // burnt red
  "#3B1F2B", // dark plum
  "#6EEB83", // bright mint green
  "#FF4E50", // vivid coral
  "#1B998B", // green-blue
  "#2D3047", // dark desaturated blue
  "#FF9F1C", // warm amber
  "#8338EC", // electric purple
  "#FB5607", // strong orange-red
  "#3A86FF", // bright blue
  "#06D6A0", // neon teal-green
  "#EF476F", // pink-red
  "#118AB2"  // medium blue (different tone than #1f77b4)
];

function getColor(distributor) {
  if (!distributor) return "#cccccc";

  // assign color if not already assigned
  if (!distributorColors[distributor]) {
    const index = Object.keys(distributorColors).length;
    distributorColors[distributor] = palette[index % palette.length];
  }

  return distributorColors[distributor];
}

function style(feature) {
  const state = feature.properties.name;
  const distributor = distributorData[state];

  return {
    fillColor: getColor(distributor),
    weight: 1,
    opacity: 1,
    color: 'white',
    fillOpacity: 0.7
  };
}

/*********************************************************
INTERACTION
*********************************************************/
function onEachFeature(feature, layer) {
  const state = feature.properties.name;
  const distributor = distributorData[state] || "Unassigned";

  layer.bindPopup(`<b>${state}</b><br/>Distributor: ${distributor}`);
}

/*********************************************************
LOAD MAP LAYER
*********************************************************/
async function loadMap() {
  const geoRes = await fetch(GEOJSON_URL);
  const geoData = await geoRes.json();

  geoLayer = L.geoJson(geoData, {
    style: style,
    onEachFeature: onEachFeature
  }).addTo(map);
}

/*********************************************************
LEGEND
*********************************************************/
function addLegend() {
  const legend = L.control({ position: 'bottomright' });

  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');

    div.innerHTML += '<b>Distributors</b><br>';

    Object.entries(distributorColors).forEach(([name, color]) => {
      div.innerHTML += `
        <i style="background:${color};width:12px;height:12px;display:inline-block;margin-right:6px"></i>
        ${name}<br>
      `;
    });

    div.innerHTML += `
      <i style="background:#ccc;width:12px;height:12px;display:inline-block;margin-right:6px"></i>
      Unassigned
    `;

    return div;
  };

  legend.addTo(map);
}

/*********************************************************
INIT
*********************************************************/
async function init() {
  if (!SHEET_CSV_URL.includes('http')) {
    alert("Please set your Google Sheet CSV URL.");
    return;
  }

  await loadSheetData();
  await loadMap();
  addLegend();
}

init();

</script>
</body>
</html>
