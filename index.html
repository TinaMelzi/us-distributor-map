<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>US Distributor Map</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100%; }
    .legend {
      background: white;
      padding: 10px;
      line-height: 1.4em;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
<div id="map"></div>

<script>
/*********************************************************
CONFIGURATION
*********************************************************/

// OPTION 1 (recommended): publish Google Sheet as CSV
// Example format:
// state,distributor
// CA,Distributor A
// NV,Distributor B
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR8__ns1VPKjm46xYBZDuiatEvjysORVUIh8JHUE3n0jg-mG7g4a-T7UI8MEgrglcE7kJN8AFMuaTno/pub?output=csv";


// US States GeoJSON (simplified CDN)
const GEOJSON_URL = "https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-states.json";

/*********************************************************
MAP INIT
*********************************************************/
const map = L.map('map').setView([39.5, -98.35], 4);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '© OpenStreetMap'
}).addTo(map);

let geoLayer;
let distributorData = {};

/*********************************************************
DATA LOADING (Google Sheets CSV)
*********************************************************/
async function loadSheetData() {
  const res = await fetch(SHEET_CSV_URL);
  const text = await res.text();

  const rows = text.trim().split('\n');
  const headers = rows[0].split(/,|\\t/);

  const stateIdx = headers.indexOf('state');
  const distIdx = headers.indexOf('distributor');

  distributorData = {};

  for (let i = 1; i < rows.length; i++) {
    const cols = rows[i].split(/,|\\t/);
    const state = cols[stateIdx].trim();
    const distributor = cols[distIdx].trim();
    distributorData[state] = distributor;
  }
}

/*********************************************************
COLORING
*********************************************************/
function getColor(distributor) {
  const colors = {
    "Distributor A": "#1f77b4",
    "Distributor B": "#ff7f0e",
    "Distributor C": "#2ca02c",
    "default": "#cccccc"
  };
  return colors[distributor] || colors.default;
}

function style(feature) {
  const state = feature.properties.name;
  const distributor = distributorData[state];

  return {
    fillColor: getColor(distributor),
    weight: 1,
    opacity: 1,
    color: 'white',
    fillOpacity: 0.7
  };
}

/*********************************************************
INTERACTION
*********************************************************/
function onEachFeature(feature, layer) {
  const state = feature.properties.name;
  const distributor = distributorData[state] || "Unassigned";

  layer.bindPopup(`<b>${state}</b><br/>Distributor: ${distributor}`);
}

/*********************************************************
LOAD MAP LAYER
*********************************************************/
async function loadMap() {
  const geoRes = await fetch(GEOJSON_URL);
  const geoData = await geoRes.json();

  geoLayer = L.geoJson(geoData, {
    style: style,
    onEachFeature: onEachFeature
  }).addTo(map);
}

/*********************************************************
LEGEND
*********************************************************/
function addLegend() {
  const legend = L.control({ position: 'bottomright' });

  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML += '<b>Distributors</b><br>';
    div.innerHTML += '<i style="background:#1f77b4;width:12px;height:12px;display:inline-block"></i> A<br>';
    div.innerHTML += '<i style="background:#ff7f0e;width:12px;height:12px;display:inline-block"></i> B<br>';
    div.innerHTML += '<i style="background:#2ca02c;width:12px;height:12px;display:inline-block"></i> C<br>';
    div.innerHTML += '<i style="background:#ccc;width:12px;height:12px;display:inline-block"></i> Unassigned<br>';
    return div;
  };

  legend.addTo(map);
}

/*********************************************************
INIT
*********************************************************/
async function init() {
  if (!SHEET_CSV_URL.includes('http')) {
    alert("Please set your Google Sheet CSV URL.");
    return;
  }

  await loadSheetData();
  await loadMap();
  addLegend();
}

init();

</script>
</body>
</html>
